name: Update Anime CDN Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and Append Anime CDN URLs
        run: |
          mkdir -p anime-cdn
          
          TYPES="waifu neko shinobu megumin hug kiss cuddle pat slap cry smile wave dance happy blush wink smug bonk bite poke highfive laugh sleep stare baka facepalm yawn nervous thumbsup punch"
          
          for type in $TYPES; do
            echo "Fetching $type..."
            
            DATA=$(curl -s "https://nekos.best/api/v2/$type?amount=20")
            
            NEW_URLS=$(echo "$DATA" | python3 -c "
import json, sys
data = json.load(sys.stdin)
urls = [r['url'] for r in data.get('results', []) if r.get('url')]
print(json.dumps(urls))
" 2>/dev/null)
            
            if [ -n "$NEW_URLS" ] && [ "$NEW_URLS" != "[]" ]; then
              # Load existing file or create new
              if [ -f "anime-cdn/$type.json" ]; then
                EXISTING=$(cat "anime-cdn/$type.json")
                # Merge: keep existing urls, add new ones, deduplicate, limit to 200
                MERGED=$(python3 -c "
import json, sys
existing = json.loads('''$EXISTING''')
new = json.loads('''$NEW_URLS''')
all_urls = list(dict.fromkeys(existing['urls'] + new))[:200]
existing['urls'] = all_urls
existing['updated'] = '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
existing['total'] = len(all_urls)
print(json.dumps(existing))
")
                echo "$MERGED" > "anime-cdn/$type.json"
              else
                COUNT=$(echo "$NEW_URLS" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
                echo "{\"type\":\"$type\",\"updated\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"total\":$COUNT,\"urls\":$NEW_URLS}" > "anime-cdn/$type.json"
              fi
              TOTAL=$(python3 -c "import json; print(json.load(open('anime-cdn/$type.json'))['total'])")
              echo "  ✅ $type: $TOTAL total URLs"
            else
              echo "  ⚠️ $type: No new URLs"
            fi
            
            sleep 1
          done
          
          # Update combined catalog
          python3 -c "
import json, os, glob
catalog = {}
for f in sorted(glob.glob('anime-cdn/*.json')):
    name = os.path.basename(f).replace('.json', '')
    try:
        data = json.load(open(f))
        catalog[name] = data
    except: pass
catalog['_updated'] = '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
catalog['_total_images'] = sum(v.get('total', len(v.get('urls', []))) for k, v in catalog.items() if k != '_updated' and k != '_total_images')
json.dump(catalog, open('anime-cdn/catalog.json', 'w'), indent=2)
print(f'Catalog: {len([k for k in catalog if not k.startswith(\"_\")])} types, {catalog[\"_total_images\"]} total images')
"

      - name: Commit and Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add anime-cdn/
          git diff --staged --quiet || git commit -m "📸 Anime CDN: +new URLs [skip ci]"
          git push
